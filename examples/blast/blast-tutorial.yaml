# Tutorial: run a protein BLAST search (blastp) and read the results.
# Written to the skill's "teaching voice": one job per step (name the idea, do the action, or read the
# result), short lines, at most three figures by ear, captions that label where the viewer is.
# Rows are marked by accession (tr:has(a[href*="protein/<acc>."])), so the marked row is always the
# protein the narration names, whatever its rank. Spoken numbers were read from the real results.
name: blast-tutorial
url: https://blast.ncbi.nlm.nih.gov/Blast.cgi?PROGRAM=blastp&PAGE_TYPE=BlastSearch
purpose: tutorial
out: blast-tutorial.mp4
voice:
  provider: kokoro
  voice: af_heart
  pronounce:
    BLAST: blast
    blastp: blast P
    NCBI: N C B I
    UniProtKB: Uni Prot K B
    Swiss-Prot: Swiss Prot
    swissprot: Swiss Prot
    "1e-5": 1 e minus 5
    "6e-106": 6 e minus 106
    "2e-76": 2 e minus 76
subtitles: true
chapters: true
hyperframes:
  band: MVHLTPEEKSAVTALWGKVNVDEVGGEALGRLLVVYPWTQRFFESFGDLSTPDAVMGNPKVKAHGKKVLGAFSDGLAHLDNLKGTFATLSELHCDKLHVDPENFRLLGNVLVCVLAHHFGKEFTPPVQAAYQKVVAGVANALAHKYH
  bandColors: aminoacid
  emblem:
    - LHCDKLHVDPENFRLLGNVLVCVLAHHF
    - "|||||||||||||+||||||||||||||"
    - LHCDKLHVDPENFKLLGNVLVCVLAHHF

intro:
  title: Protein BLAST for beginners
  subtitle: NCBI blastp, step by step
  bullets:
    - Run a blastp search
    - Read the hits table
    - Open one alignment
  say: Which known proteins does your sequence look like? You'll run a blastp search, read the hits table, and open one alignment.

setup:
  - hide: '[id*="QSI"], [class*="QSI"], .ncbi-alerts'   # NCBI survey / feedback pop-ups and the site-wide notice bar, for the whole video
  - dismiss: { role: button, name: "Tell us what you think!", exact: true }

steps:
  - caption: The protein BLAST page
    say: This is the NCBI protein BLAST page. The blastp tab is already selected. blastp compares a protein query with a protein database.
    actions:
      - move: { css: "#blastpTab", highlight: false, ms: 1200 }
      - note: { target: { css: "#blastpTab" }, text: "protein vs. protein" }

  # ── Part 1 ────────────────────────────────────────────────────────────────
  - card: { kicker: Part 1, title: Set up the search }
    caption: Paste the query sequence
    say: Click the query box and paste your protein sequence. Ours is human hemoglobin beta.
    actions:
      - type: { target: { label: "Enter accession number(s), gi(s), or FASTA sequence(s)" }, text: "MVHLTPEEKSAVTALWGKVNVDEVGGEALGRLLVVYPWTQRFFESFGDLSTPDAVMGNPKVKAHGKKVLGAFSDGLAHLDNLKGTFATLSELHCDKLHVDPENFRLLGNVLVCVLAHHFGKEFTPPVQAAYQKVVAGVANALAHKYH", delay: 6 }

  - caption: The query box
    say: The same box also takes an accession number, or a FASTA record.
    actions:
      - note: { target: { label: "Enter accession number(s), gi(s), or FASTA sequence(s)" }, text: "FASTA or accession" }

  - caption: Choose the database
    say: Next, choose the database to search. Pick UniProtKB Swiss-Prot.
    actions:
      - select: { target: { label: "Database", exact: true }, option: "UniProtKB/Swiss-Prot(swissprot)" }

  - caption: The Swiss-Prot database
    say: Why this one? Swiss-Prot is a small set that experts have checked by hand. So every hit comes with a clear name.
    actions:
      - note: { target: { label: "Database", exact: true }, text: "Reviewed proteins" }

  - caption: Run the search
    say: Now click the blue BLAST button.
    actions:
      - click: { role: button, name: "BLAST", exact: true }

  - caption: Wait for the results
    say: BLAST compares your sequence with every protein in the database. That can take up to a minute. Then the page refreshes by itself, and the results appear.
    actions:
      - waitFor: { text: "Sequences producing significant alignments", timeout: 240000 }

  # ── Part 2 ────────────────────────────────────────────────────────────────
  - card: { kicker: Part 2, title: Read the hits table }
    caption: The search summary
    say: The results page opens with a summary of your job. Check that the database is swissprot.
    actions:
      - mark: "swissprot"

  - caption: The query length
    say: Check the query length too. Ours is 147 amino acids.
    actions:
      - mark: "Query Length"

  - caption: The descriptions table
    say: The hits are further down, in the descriptions table. Each row is one database protein that matches your query.
    actions:
      - scrollTo: { css: "#tabDescr", ms: 1200 }
      - mark: "Sequences producing significant alignments"
      - pause: 2000

  - caption: The first row
    say: The best match is on top. Here it's human hemoglobin beta itself. That tells you the search worked.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c10' }, scale: 1.9, start: 1.0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."])' }

  - card:
      kicker: Concept
      title: The E value
      image: e-value.svg
      say: Now a new term. The E value. It counts the hits this good you'd expect by pure chance. So smaller means less likely to be chance.
    caption: The E value column
    say: Find the E value column in the table. For our top hit, it reads 6e-106.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c9' }, scale: 1.9, start: 1.0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c9' }
      - note: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c9' }, text: "Hits expected by chance", side: bottom }

  - caption: The E value column
    say: That's a number with over a hundred zeros after the decimal point. It's as good as zero. This match is not chance.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c9' }, scale: 1.9, start: 0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c9' }

  - caption: The E value rule
    say: Here's the rule of thumb. An E value below 1e-5 usually means a real relationship.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c9' }, scale: 1.9, start: 0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c9' }
      - note: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c9' }, text: "Below 1e-5", side: bottom }

  - caption: The percent identity column
    say: The next column is percent identity. It's the share of aligned positions with the same amino acid.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c10' }, scale: 1.9, start: 0.5, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c10' }
      - note: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P68871."]) td.c10' }, text: "Share of identical positions", side: bottom }

  - caption: The percent identity column
    say: Our protein matches itself at 100 percent. The gorilla, in row two, is just over 99 percent.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P02024."]) td.c10' }, scale: 1.9, start: 0.5, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P02024."])' }
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P02024."]) td.c10' }

  - card:
      kicker: Question
      title: Is every hit the same protein?
      think: 3
      say: A question before we go on. Is every hit in this table the same protein?
    caption: The description column
    say: Read the description too. This row is human hemoglobin delta. It's a related globin, not the same protein.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P02042."]) td.c10' }, scale: 1.9, start: 1.0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P02042."])' }

  - caption: Hemoglobin delta
    say: It's about 93 percent identical. And its E value is still tiny.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P02042."]) td.c10' }, scale: 1.9, start: 0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P02042."]) td.c10' }
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P02042."]) td.c9' }

  - caption: A more distant species
    say: Now look further down the list. Mouse hemoglobin beta is about 80 percent identical.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P02088."]) td.c10' }, scale: 1.9, start: 1.0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P02088."])' }
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P02088."]) td.c10' }

  - caption: A more distant species
    say: Its E value is still far below 1e-5. So it's a real beta globin. E value first, then identity.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P02088."]) td.c9' }, scale: 1.9, start: 0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P02088."]) td.c9' }

  # ── Part 3 ────────────────────────────────────────────────────────────────
  - card: { kicker: Part 3, title: Open one alignment }
    caption: Open the gorilla hit
    say: How does a hit line up with your query? Click its description. Let's open the gorilla hit, in row two.
    actions:
      - scrollTo: { css: "#tabDescr", ms: 1200 }
      - click: { css: "a[href='#alnHdr_P02024']" }
      - pause: 2000

  - caption: The alignment
    zoom: { target: { x: 631, y: 290 }, scale: 1.6, start: 0.5 }
    say: This is the alignment. Your query is on top. The database protein is below.
    actions:
      - mark: { css: "#ar_P02024_1" }

  - caption: The middle line
    zoom: { target: { x: 631, y: 290 }, scale: 1.6, start: 0 }
    say: Now look at the middle line. A letter means the two are identical there. A plus sign means similar. A blank means different.
    actions:
      - pause: 400

  - caption: The identities count
    zoom: { target: { x: 600, y: 255 }, scale: 1.6, start: 0 }
    say: The header counts it for you. 146 of 147 positions are identical. That's the 99 percent from the table.
    actions:
      - mark: "146/147(99%)"

  - caption: The one difference
    zoom: { target: { x: 600, y: 255 }, scale: 1.6, start: 0 }
    say: Here is the one difference. Human has arginine, R. Gorilla has lysine, K. The plus sign says they're similar.
    actions:
      - mark: "ENF+LLG"

  - hidden: true
    actions:
      - goto: "https://blast.ncbi.nlm.nih.gov/Blast.cgi?PROGRAM=blastp&PAGE_TYPE=BlastSearch"
      - networkIdle: true

  # ── Part 4 ────────────────────────────────────────────────────────────────
  - card: { kicker: Part 4, title: Now a second example, subtitle: Human insulin, emblem: [MALWMRLLPLLALLALWGPDPAAAFVNQ] }
    caption: Paste the insulin sequence
    say: Now run it again with a different protein. On a fresh search page, paste human insulin.
    actions:
      - type: { target: { label: "Enter accession number(s), gi(s), or FASTA sequence(s)" }, text: "MALWMRLLPLLALLALWGPDPAAAFVNQHLCGSHLVEALYLVCGERGFFYTPKTRREAEDLQVGQVELGGGPGAGSLQPLALEGSLQKRGIVEQCCTSICSLYQLENYCN", delay: 6 }

  - caption: The same database
    captionPosition: top
    say: Choose the same database, Swiss-Prot. That way you can compare the two results.
    actions:
      - select: { target: { label: "Database", exact: true }, option: "UniProtKB/Swiss-Prot(swissprot)" }

  - caption: Run the search
    captionPosition: top
    say: Then click BLAST, and wait as before.
    actions:
      - click: { role: button, name: "BLAST", exact: true }

  - hidden: true
    actions:
      - waitFor: { text: "Sequences producing significant alignments", timeout: 240000 }
      - scrollTo: { css: "#tabDescr", ms: 200 }

  - caption: Insulin's first row
    say: Human insulin is the top hit, at 100 percent identity. Just like before.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P01308."]) td.c10' }, scale: 1.9, start: 1.0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P01308."])' }
      - pause: 2000

  - caption: Insulin's E value
    say: But look at its E value. It's 2e-76. Hemoglobin's was 6e-106.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P01308."]) td.c9' }, scale: 1.9, start: 0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P01308."]) td.c9' }

  - caption: Insulin's E value
    say: Why is it larger? Insulin is a shorter protein, only 110 amino acids. A shorter match can't reach as small an E value.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P01308."]) td.c9' }, scale: 1.9, start: 0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P01308."]) td.c9' }

  - caption: Rat insulin
    say: Identity drops sooner here too. Rat insulin is only about 83 percent identical.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P01323."]) td.c10' }, scale: 1.9, start: 1.0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P01323."])' }
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P01323."]) td.c10' }

  - caption: Chicken insulin
    captionPosition: top
    say: Chicken insulin is about 64 percent identical. Is that still a real match? Check the E value.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P67970."]) td.c10' }, scale: 1.9, start: 1.0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P67970."])' }
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P67970."]) td.c10' }

  - caption: Chicken insulin
    captionPosition: top
    say: It's far below 1e-5. So yes, it's a real insulin.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P67970."]) td.c9' }, scale: 1.9, start: 0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P67970."]) td.c9' }

  - caption: A relative of insulin
    say: Near the bottom, read the description again. This is insulin-like growth factor 2. It's a relative, but a different protein.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P01344."]) td.c10' }, scale: 1.9, start: 1.0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P01344."])' }

  - caption: A relative of insulin
    say: It's only about 34 percent identical. Its E value is still below 1e-5. So the relationship is real.
    zoom: { target: { css: '#dscTable tbody tr:has(a[href*="protein/P01344."]) td.c9' }, scale: 1.9, start: 0, offset: { x: -220 } }
    actions:
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P01344."]) td.c10' }
      - mark: { css: '#dscTable tbody tr:has(a[href*="protein/P01344."]) td.c9' }

end_card:
  title: You can now run blastp
  subtitle: Recap
  bullets:
    - Paste your sequence
    - Pick a database
    - Click BLAST
    - E value first
    - Then percent identity
    - Read the description
  say: To recap. Paste your sequence, pick a database, and click BLAST. In the hits table, check the E value first. Below 1e-5 usually means a real relationship. Then percent identity. And always read the description. You started with a sequence and no idea what it was. Now you can ask the database, and judge the answer yourself.
